		7A1C0F2E9B4D41A8B6E30C55 /* Verify bundled Core ML model */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
				"$(SRCROOT)/RiftboundVisionApp/Services/CardDetectionModelLoader.swift",
			);
			name = "Verify bundled Core ML model";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Fails the build when the trained Core ML model the app actually loads\n# isn't in the built bundle.\n#\n# An .mlpackage added to Compile Sources instead of Copy Bundle Resources\n# is never compiled to .mlmodelc or copied. The build still succeeds, the\n# app still launches, and CardDetectionModelLoader quietly falls back to\n# the geometric detector - so cards are found but never identified. That\n# has happened twice here; both times it looked like a model problem\n# rather than a project-file one.\n#\n# The expected name is read out of CardDetectionModelLoader.swift rather\n# than hardcoded, so swapping the model cannot leave this check behind\n# guarding a file nobody loads. That read is why the loader is declared in\n# this phase's inputPaths: script phases run sandboxed, and an undeclared\n# file can be stat-ed but not read, which fails as \"Operation not\n# permitted\" rather than as \"not found\".\n#\n# No backslashes anywhere on purpose - this string is escaped into\n# project.pbxproj, and a regex full of them does not survive the trip.\nLOADER=\"$SRCROOT/RiftboundVisionApp/Services/CardDetectionModelLoader.swift\"\nif [ ! -r \"$LOADER\" ]; then\n  echo \"warning: cannot read $LOADER; skipping the bundled-model check\"\n  exit 0\nfi\n\nMODEL=$(awk -F'\"' '/static let modelName/ { print $2; exit }' \"$LOADER\")\nif [ -z \"$MODEL\" ]; then\n  echo \"warning: could not read modelName from CardDetectionModelLoader.swift; skipping the bundled-model check\"\n  exit 0\nfi\n\nCOMPILED=\"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/$MODEL.mlmodelc\"\nif [ ! -d \"$COMPILED\" ]; then\n  echo \"error: $MODEL.mlmodelc is missing from the built app bundle. Add $MODEL.mlpackage to this target's Copy Bundle Resources phase (not Compile Sources). Without it the app runs on the fallback detector and cannot identify cards.\"\n  exit 1\nfi\necho \"Verified $MODEL.mlmodelc is in the bundle.\"\n";
		};
/* End PBXShellScriptBuildPhase section */

